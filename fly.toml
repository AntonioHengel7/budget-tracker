# Fly.io deploy config for budget-tracker.
#
# `app` and `primary_region` are set to the live "moonbudget" deployment.
# If the app is ever renamed or moved to a different region, update them here.
app = "moonbudget"
primary_region = "lax"

[build]

[env]
  DATA_DIR = "/data"
  # Fly.io's edge proxy is a single hop to the app -- see the matching
  # DEFAULT_TRUST_PROXY doc comment in src/server/index.ts. Set explicitly
  # here (rather than relying on that code default) so the deploy config
  # itself is unambiguous about the trust-proxy topology it assumes.
  TRUST_PROXY = "1"

# SESSION_SECRET, AUTH_USERS_JSON, and RESEND_API_KEY are secrets -- never
# set them here. Configure them with:
#   fly secrets set SESSION_SECRET=... AUTH_USERS_JSON=... RESEND_API_KEY=...
#
# RESEND_API_KEY, EMAIL_FROM_ADDRESS, and PUBLIC_APP_URL together gate
# self-service signup (#104) -- unset/empty RESEND_API_KEY leaves the
# feature fully disabled (see index.ts's boot()). EMAIL_FROM_ADDRESS and
# PUBLIC_APP_URL aren't secret-shaped, so they can go in [env] above instead
# of `fly secrets set` -- deployer's choice -- but once RESEND_API_KEY is
# set, both become required or the app fails to boot.

[[mounts]]
  source = "budget_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"
