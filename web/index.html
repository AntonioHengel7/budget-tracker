<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Budget Tracker is a personal budget tracker for logging income and expenses and setting spending limits."
    />
    <title>Budget Tracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='18' width='6' height='10' fill='%231a4d7a'/%3E%3Crect x='13' y='12' width='6' height='16' fill='%231a4d7a'/%3E%3Crect x='22' y='6' width='6' height='22' fill='%231a4d7a'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
