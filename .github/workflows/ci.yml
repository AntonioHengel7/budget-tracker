name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets a deploy of the current main be re-triggered from the Actions tab
  # without an empty commit -- e.g. after resolving a transient Fly-side
  # issue that made a push-triggered deploy fail.
  workflow_dispatch:

jobs:
  # Computes which parts of the tree changed so app tests/build/deploy can
  # be skipped for infra/-only changes (Phase 3 of the devops-learning
  # track) while manifest validation still runs. `non_infra` matches every
  # changed file EXCEPT under infra/ -- the '**' + '!infra/**' pair is
  # dorny/paths-filter's way of expressing "at least one file outside
  # infra/ changed", not just "infra/ changed" (which `infra` below
  # already covers on its own).
  changes:
    runs-on: ubuntu-latest
    outputs:
      non_infra: ${{ steps.filter.outputs.non_infra }}
      infra: ${{ steps.filter.outputs.infra }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            non_infra:
              - '**'
              - '!infra/**'
            infra:
              - 'infra/k8s/**'
              - 'infra/helm/**'
            terraform:
              - 'infra/terraform/**'

  ci:
    needs: changes
    if: needs.changes.outputs.non_infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against dead eslint-disable comments
        run: |
          HITS=$(grep -rIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude='*.md' --exclude=ci.yml -e 'eslint-disable' . || true)
          if [ -n "$HITS" ] && ! grep -q '"eslint"' package.json web/package.json; then
            echo "Found eslint-disable comment(s) but no eslint dependency in package.json or web/package.json:"
            echo "$HITS"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run cover
      - run: bash .claude/hooks/lib/coverage-gate.sh --mode bar --core-threshold 95
      - run: docker build -t budget-tracker:ci .

      - name: Run built image and verify /healthz
        run: |
          set -e

          # Throwaway, CI-only credentials -- not used anywhere real. The
          # hash is a genuine bcrypt hash (at the pinned BCRYPT_COST=10) of a
          # password that only ever exists in this line, so loadCredentials'
          # shape/cost validation passes and the server can actually boot.
          SESSION_SECRET="ci-only-throwaway-session-secret-not-a-real-secret"
          AUTH_USERS_JSON='[{"username":"ciuser","passwordHash":"$2a$10$YYcfaFJ18Lfjv.O4KF2YQucz3Gm2v8e5K/zqawcOc9ZVVGz82Cn96"}]'

          # Bind-mounted temp dir standing in for the Fly volume at /data.
          DATA_DIR_HOST=$(mktemp -d)
          CONTAINER_ID=$(docker run -d \
            -p 8080:8080 \
            -e SESSION_SECRET="$SESSION_SECRET" \
            -e AUTH_USERS_JSON="$AUTH_USERS_JSON" \
            -e TRUST_PROXY=1 \
            -v "$DATA_DIR_HOST:/data" \
            budget-tracker:ci)

          cleanup() {
            # Capture the exit status we were called with -- entrypoint.sh
            # chowns the bind-mounted dir to the in-container `node` user,
            # which the CI runner's own user doesn't own on a sticky-bit
            # tmp filesystem, so a plain `rm -rf` below fails with
            # "Operation not permitted". Without saving/restoring $?, that
            # failure (combined with `set -e` inside this EXIT trap) would
            # silently turn a passing healthz check into a failed job.
            local status=$?
            echo "--- container logs ---"
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true
            sudo rm -rf "$DATA_DIR_HOST" 2>/dev/null || rm -rf "$DATA_DIR_HOST" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          echo "Waiting for /healthz to return 200..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthz OK (attempt $i)"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null)" != "true" ]; then
              echo "Container exited before /healthz returned 200"
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for /healthz to return 200"
          exit 1

  web:
    needs: changes
    if: needs.changes.outputs.non_infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run cover
        working-directory: web
      - run: npm run build
        working-directory: web

  # Validates infra/k8s's raw manifests and the Helm chart's rendered
  # output against the real Kubernetes API schemas -- catches typos'd
  # field names, wrong types, etc. without needing a live cluster.
  # Runs independently of ci/web so it still executes for infra-only PRs.
  validate-manifests:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate raw manifests
        run: kubeconform -strict -summary $(find infra/k8s -name '*.yaml')
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/budget-tracker
      - name: Validate rendered Helm output
        run: helm template budget-tracker infra/helm/budget-tracker | kubeconform -strict -summary -

  # Builds and pushes the same image the smoke test just proved boots and
  # answers /healthz, tagged by commit SHA (and `latest` on main) -- lets
  # infra/k8s and infra/helm reference a real, pulled image instead of only
  # the kind-load-only :local tag from local development.
  ghcr:
    needs: [ci, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
      - run: docker push "$IMAGE:latest" && docker push "$IMAGE:${{ github.sha }}"

  # `terraform plan` needs real AWS credentials to read current state, so
  # this only runs anything meaningful once AWS_ACCESS_KEY_ID/
  # AWS_SECRET_ACCESS_KEY repo secrets are configured (Phase 4). Gated to
  # pull_request only -- plan is a read-only dry run, safe to show on every
  # PR that touches Terraform; it never applies anything.
  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive ../../
      - run: terraform init -backend=false
      - run: terraform validate
      - name: terraform plan
        run: terraform init && terraform plan -no-color
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

  # Runs after both jobs above pass, and only on a push to main (never on a
  # PR -- a PR is unreviewed/unmerged code) or a manual workflow_dispatch of
  # main. main is already gated behind pre-merge-gate.sh's SOCRATES/PLATO/
  # HOBBES + CI requirement before anything can merge, so "merge to main" is
  # the intended, sole deploy trigger -- this job just makes that automatic
  # instead of the previous manual `fly deploy` step.
  deploy:
    needs: [ci, web]
    # refs/heads/main only ever matches a push to main or a workflow_dispatch
    # run against main -- a pull_request event's ref is refs/pull/<n>/merge,
    # so this alone already excludes PRs without a separate event_name check.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app moonbudget
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
