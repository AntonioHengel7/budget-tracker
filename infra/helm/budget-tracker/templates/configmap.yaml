apiVersion: v1
kind: ConfigMap
metadata:
  name: budget-config
data:
  PORT: {{ .Values.config.port | quote }}
  DATA_DIR: {{ .Values.config.dataDir | quote }}
  TRUST_PROXY: {{ .Values.config.trustProxy | quote }}
  MYSQL_DATABASE: {{ .Values.config.mysqlDatabase | quote }}
  INSECURE_COOKIES: {{ .Values.config.insecureCookies | quote }}
