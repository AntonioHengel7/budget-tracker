# Compare to infra/k8s/examples/secret.example.yaml's DATABASE_URL, which
# was hand-typed and had to be kept in sync with MYSQL_USER/PASSWORD/DATABASE
# by hand. Here it's built from the same three values.yaml fields the mysql
# StatefulSet itself uses -- change .Values.secrets.mysqlPassword once and
# both this Secret's MYSQL_PASSWORD and its DATABASE_URL stay consistent
# automatically. This is the concrete thing templating buys you over plain
# manifests.
apiVersion: v1
kind: Secret
metadata:
  name: budget-secrets
type: Opaque
stringData:
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  AUTH_USERS_JSON: {{ .Values.secrets.authUsersJson | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.mysqlRootPassword | quote }}
  MYSQL_USER: {{ .Values.secrets.mysqlUser | quote }}
  MYSQL_PASSWORD: {{ .Values.secrets.mysqlPassword | quote }}
  DATABASE_URL: "mysql://{{ .Values.secrets.mysqlUser }}:{{ .Values.secrets.mysqlPassword }}@mysql:3306/{{ .Values.config.mysqlDatabase }}"
