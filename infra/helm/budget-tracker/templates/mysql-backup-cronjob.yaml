# Mirrors infra/k8s/09-mysql-backup-cronjob.yaml -- see that file's comments
# for the .part/mv atomicity reasoning and the MYSQL_PWD choice.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mysqldump
              image: mysql:8
              env:
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: budget-secrets
                      key: MYSQL_ROOT_PASSWORD
              command:
                - sh
                - -c
                - |
                  set -eu
                  export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"
                  FILE="/backups/backup-$(date +%Y%m%d%H%M%S).sql"
                  TMP="$FILE.part"
                  mysqldump -h mysql -uroot --single-transaction --all-databases > "$TMP"
                  mv "$TMP" "$FILE"
                  echo "Backup written: $FILE ($(wc -c < "$FILE") bytes)"
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mysql-backups
