# Picked up automatically by kube-prometheus-stack's Grafana sidecar (see
# values-kube-prometheus-stack.yaml's grafana.sidecar.datasources.enabled)
# because of the grafana_datasource label below -- no manual UI step.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        isDefault: false
