# Template only -- copy this to infra/k8s/secret.yaml and fill in real
# (still dev-only, never-actually-secret) values before `kubectl apply`.
# infra/k8s/secret.yaml is gitignored; this example is the only one
# committed, so the shape of a real Secret manifest is visible in git
# without ever committing an actual value.
#
# `stringData` lets you write plain text here -- the Kubernetes API server
# base64-encodes it for you and stores the result as `data`. That's *all*
# base64 does for a Secret by default: obscure, not encrypt. Anyone with
# read access to Secrets in this namespace can trivially decode it
# (`kubectl get secret budget-secrets -o jsonpath='{.data.SESSION_SECRET}' | base64 -d`).
# Real secret-at-rest encryption (e.g. cluster-level encryption providers,
# Vault, sealed-secrets) is a separate topic, not covered in this phase.
apiVersion: v1
kind: Secret
metadata:
  name: budget-secrets
  namespace: moonbudget
type: Opaque
stringData:
  # Throwaway dev-only values -- same shape as ci.yml's CI smoke test and
  # infra/docker-compose.yml's app service. Never used anywhere real.
  SESSION_SECRET: 'kind-dev-only-session-secret-not-a-real-secret'
  AUTH_USERS_JSON: '[{"username":"devuser","passwordHash":"$2a$10$YYcfaFJ18Lfjv.O4KF2YQucz3Gm2v8e5K/zqawcOc9ZVVGz82Cn96"}]'
  MYSQL_ROOT_PASSWORD: dev-root-password
  MYSQL_USER: budgetuser
  MYSQL_PASSWORD: dev-password
  # `mysql` here is the mysql Service's name (05-mysql-service.yaml) --
  # inside the cluster, a Service name alone resolves via DNS to that
  # Service, same as Phase 1's Compose network resolved the hostname
  # `mysql` to the MySQL container. Must match MYSQL_USER/PASSWORD/DATABASE
  # above and MYSQL_DATABASE in 01-configmap.yaml.
  DATABASE_URL: mysql://budgetuser:dev-password@mysql:3306/budgettracker
